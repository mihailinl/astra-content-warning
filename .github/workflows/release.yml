name: release
# Builds astra-gi.zip from PUBLIC inputs only (the Astra SDK, BepInEx.Core, UnityEngine.Modules;
# BepInEx's own release, digest-verified) — this workflow NEVER touches Lethal Company's files,
# and never could: GitHub Actions has no copy of the game. See docs in astra-bepinex:
# GAME-INTEGRATION-MANIFEST.md §6 and GAME-INTEGRATIONS.md §2 (the SDK, Astra.Sdk.GameType).
#
# Trigger: push a tag "v*". The resulting astra-gi.zip is attached to that tag's GitHub release —
# that is the one file Astra's installer reads (GAME-INTEGRATION-MANIFEST.md §1).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # to attach astra-gi.zip to the release

env:
  ASSEMBLY_NAME: AstraContentWarning
  PLUGIN_FOLDER: AstraContentWarning
  TFM: netstandard2.1

  # The Astra SDK (a compile-only reference) comes from the foundation's release until it is on
  # nuget.org: the exact package packages.lock.json pins by content hash, digest-checked here too.
  ASTRA_SDK_URL: "https://github.com/mihailinl/astra-bepinex/releases/download/v0.5.0/Astra.Unity.Sdk.0.5.0.nupkg"
  ASTRA_SDK_SHA256: "17a3ac630ee3d602093d51dd658f8a94f797c0fcb15bc3a92d7027396d5d27ba"

  BEPINEX_VERSION: "5.4.23.5"
  BEPINEX_ZIP_URL: "https://github.com/BepInEx/BepInEx/releases/download/v5.4.23.5/BepInEx_win_x64_5.4.23.5.zip"
  BEPINEX_ZIP_SHA256: "82f9878551030f54657792c0740d9d51a09500eeae1fba21106b0c441e6732c4"

  # The foundation's Mono DLLs come from its runner release ("Astra for any Unity game"), whose zip
  # root holds BepInEx/plugins/Astra/ — exactly the layout tools/make-astra-gi.sh reads. Bump both
  # lines (and ASTRA_BEPINEX_REF above) together when this integration moves to a newer foundation.
  FOUNDATION_ASSET_URL: "https://github.com/mihailinl/astra-bepinex/releases/download/v0.5.0/astra-gi.zip"
  FOUNDATION_ASSET_SHA256: "7b58b749517c2ed745b2942f2e860df5f4e5af729185371a7a7aebcb9f25ae67"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this integration
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download the Astra SDK package (digest-pinned)
        run: |
          mkdir -p "${{ github.workspace }}/nuget-local"
          curl -sSL -o "${{ github.workspace }}/nuget-local/Astra.Unity.Sdk.0.5.0.nupkg" "${{ env.ASTRA_SDK_URL }}"
          echo "${{ env.ASTRA_SDK_SHA256 }}  ${{ github.workspace }}/nuget-local/Astra.Unity.Sdk.0.5.0.nupkg" | sha256sum -c -

      - name: Add the local SDK feed
        run: dotnet nuget add source "${{ github.workspace }}/nuget-local" -n astra-local

      - name: Restore (locked — packages.lock.json pins every version)
        run: dotnet restore -p:RestoreLockedMode=true

      - name: Build
        run: dotnet build -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Download BepInEx
        run: curl -sSL -o bepinex.zip "${{ env.BEPINEX_ZIP_URL }}"

      - name: Verify BepInEx's digest
        run: echo "${{ env.BEPINEX_ZIP_SHA256 }}  bepinex.zip" | sha256sum -c -

      - name: Unpack BepInEx
        run: mkdir -p bepinex-dist && unzip -q bepinex.zip -d bepinex-dist

      - name: Download the Astra foundation (its runner release, digest-pinned)
        run: |
          curl -sSL -o foundation.zip "${{ env.FOUNDATION_ASSET_URL }}"
          echo "${{ env.FOUNDATION_ASSET_SHA256 }}  foundation.zip" | sha256sum -c -
          mkdir -p "${{ github.workspace }}/foundation-mono"
          unzip -q foundation.zip -d "${{ github.workspace }}/foundation-mono"

      - name: Lay out astra-gi.zip
        env:
          FOUNDATION_DIR: ${{ github.workspace }}/foundation-mono
          BEPINEX_DIST: ${{ github.workspace }}/bepinex-dist
        run: bash tools/make-astra-gi.sh

      - name: List astra-gi.zip's entries
        run: unzip -l astra-gi.zip

      - name: Attach astra-gi.zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: astra-gi.zip
